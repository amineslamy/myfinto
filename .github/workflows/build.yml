name: Build and Release APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare stable signing key
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
        fi

    - name: Build with Gradle
      run: |
        set +e
        ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log
        build_status=${PIPESTATUS[0]}
        if [ "$build_status" -ne 0 ]; then
          ERROR_LINES=$(grep -E "^e: |error: |FAILURE: Build failed" gradle-build.log | head -n 10 | sed 's/%/%25/g' | tr '\n' '|')
          FAILURE_BLOCK=$(grep -A 12 "What went wrong" gradle-build.log | head -n 16 | sed 's/%/%25/g' | tr '\n' '|')
          if [ -n "$ERROR_LINES" ]; then
            echo "::error title=Build error lines::${ERROR_LINES//|/%0A}"
          else
            echo "::error title=Build error lines::No Kotlin error lines were captured"
          fi
          if [ -n "$FAILURE_BLOCK" ]; then
            echo "::error title=Gradle failure summary::${FAILURE_BLOCK//|/%0A}"
          else
            echo "::error title=Gradle failure summary::No failure summary was captured"
          fi
          tail -n 60 gradle-build.log
        fi
        exit "$build_status"
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    - name: Show version and signing info
      run: |
        grep -E "versionCode|versionName" app/build.gradle.kts
        BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
        "$BUILD_TOOLS_DIR/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "certificate" || true

    - name: Prepare APK for download
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk myfinto.apk
        ls -lh myfinto.apk

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: myfinto-apk
        path: myfinto.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: myfinto.apk
        asset_name: myfinto-${{ github.ref_name }}.apk
        asset_content_type: application/vnd.android.package-archive
